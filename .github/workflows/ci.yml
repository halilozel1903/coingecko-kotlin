name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Test client
        run: ./gradlew :coingecko:test
      - name: Build sample
        run: ./gradlew :sample:assembleDebug
      - name: Verify publishing (what JitPack runs)
        run: ./gradlew publishToMavenLocal

  screenshots:
    name: README screenshots
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build sample
        # Keyless by default. If the repository has a COINGECKO_DEMO_API_KEY secret (a free Demo key), the sample
        # sends it, which avoids the shared keyless rate limit of CI runners. Either way the data is live.
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: ./gradlew :sample:assembleDebug
      - name: Capture phone screenshots
        # Markets with the global header, Bitcoin's 7 day chart and trending coins, live from the keyless CoinGecko
        # API. A scene that CoinGecko refuses or rate limits past its retries fails this step; nothing is faked.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: phone
          script: bash scripts/screenshots.sh phone
      - name: Commit screenshots
        run: |
          git config user.name "Halil Özel"
          git config user.email "halilozel1903@gmail.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi
