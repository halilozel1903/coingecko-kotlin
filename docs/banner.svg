    <text x="130" y="124" font-size="22" font-weight="600" fill="#9FE3B9" letter-spacing="1">KOTLIN · ANDROID · COMPOSE</text>
    <text x="70" y="214" font-size="60" font-weight="800" fill="#FFFFFF">coingecko-kotlin</text>
    <text x="72" y="264" font-size="25" fill="#C9DDD1">Coroutine client for the CoinGecko API</text>
    <text x="72" y="298" font-size="25" fill="#C9DDD1">with a Compose crypto tracker.</text>

    <g font-size="18" font-weight="600">
      <rect x="72" y="338" width="112" height="40" rx="20" fill="#1C3A2A" stroke="#2F6B4A"/>
      <text x="128" y="364" text-anchor="middle" fill="#B9F0CF">Markets</text>
      <rect x="196" y="338" width="148" height="40" rx="20" fill="#1C3A2A" stroke="#2F6B4A"/>
      <text x="270" y="364" text-anchor="middle" fill="#B9F0CF">Price charts</text>
      <rect x="356" y="338" width="120" height="40" rx="20" fill="#1C3A2A" stroke="#2F6B4A"/>
      <text x="416" y="364" text-anchor="middle" fill="#B9F0CF">Trending</text>
      <rect x="72" y="390" width="140" height="40" rx="20" fill="#1C3A2A" stroke="#2F6B4A"/>
      <text x="142" y="416" text-anchor="middle" fill="#B9F0CF">Global stats</text>
      <rect x="224" y="390" width="140" height="40" rx="20" fill="#1C3A2A" stroke="#2F6B4A"/>
      <text x="294" y="416" text-anchor="middle" fill="#B9F0CF">429 backoff</text>
      <rect x="376" y="390" width="164" height="40" rx="20" fill="#1C3A2A" stroke="#2F6B4A"/>
      <text x="458" y="416" text-anchor="middle" fill="#B9F0CF">No key needed</text>
    </g>
    <text x="72" y="486" font-size="17" fill="#7FA48E">Data provided by CoinGecko</text>
  </g>

