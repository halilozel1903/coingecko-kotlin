    <path d="M160 0V560M320 0V560M480 0V560M640 0V560M800 0V560M960 0V560M1120 0V560"/>
  </g>

  <!-- Title block -->
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
