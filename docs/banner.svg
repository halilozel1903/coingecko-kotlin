<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="coingecko-kotlin: Kotlin client for the CoinGecko API with a Compose crypto tracker" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A13"/>
      <stop offset="1" stop-color="#12261C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#2FBF71" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2FBF71" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="kotlin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7F52FF"/>
      <stop offset="1" stop-color="#E44857"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <rect width="1280" height="560" fill="url(#glow)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.04">
